name: Verify engine and proof snapshot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    name: Offline engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: python -m pip install '.[dev]'
      - name: Install pinned Lean version manager
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: certified_lean/.lake
          key: ${{ runner.os }}-mathlib-${{ hashFiles('certified_lean/lean-toolchain', 'certified_lean/lakefile.lean', 'certified_lean/lake-manifest.json') }}
      - name: Prepare exact pinned Mathlib workspace
        working-directory: certified_lean
        run: |
          lake exe cache get
          lake env lean --version
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          git diff --exit-code -- lean-toolchain lakefile.lean lake-manifest.json
      - name: Run account-free adjacency-code example
        run: timeout 60 python -B -m examples.adjacency_code_demo
      - name: Replay one named archived proof
        run: >-
          python scripts/replay_results.py --id archetype_chi_ge_omega
          --timeout 60 --output runs/ci-named-replay.json
      - name: Compile standalone reuse example and audit its axioms
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from autonomous_math.prover.lean_prover import LeanToolchain, _target_axiom_report
          from autonomous_math.research_state import ALLOWED_AXIOMS

          source = Path("examples/ReuseCliqueBound.lean").read_text()
          target = "MathFoundryExamples.clique_bound"
          report = {"source_sha256": hashlib.sha256(source.encode()).hexdigest(),
                    "theorem_name": target, "timeout_sec": 60, "model_requests": 0}
          toolchain = LeanToolchain()
          try:
              code, stdout, stderr = toolchain.run_lean_code(source, timeout=60)
              axioms, error = _target_axiom_report(stdout, target)
              passed = (code == 0 and error is None and set(axioms) <= ALLOWED_AXIOMS
                        and "error:" not in stdout + stderr
                        and "declaration uses" not in stdout + stderr)
              report.update(exit_code=code, stdout=stdout, stderr=stderr, axioms=axioms,
                            axiom_audit_error=error, passed=passed,
                            compiler_transport=dict(toolchain.last_run_metadata))
          finally:
              toolchain.cancel()
              report["remaining_owned_process_groups"] = toolchain.active_process_groups()
              Path("runs").mkdir(exist_ok=True)
              Path("runs/ci-example-reuse.json").write_text(json.dumps(report, indent=2) + "\n")
          if not report.get("passed") or report["remaining_owned_process_groups"]:
              raise SystemExit("Standalone reuse example failed exact kernel/allowed-axiom verification")
          print("Standalone reuse example passed; axioms:", ", ".join(axioms) or "none")
          PY
      - name: Build an independent Git-based Lean library consumer
        run: >-
          python scripts/check_lean_library.py
          --git-repository "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA"
          --build-timeout 2400 --timeout 3000
          --output runs/ci-library-consumer.json
      - name: Run tests without a model provider
        run: python -m pytest -q --junitxml=runs/ci-tests.xml
      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-tests
          path: |
            runs/ci-tests.xml
            runs/ci-named-replay.json
            runs/ci-example-reuse.json
            runs/ci-library-consumer.json
          if-no-files-found: warn

  replay:
    name: Exact Lean replay ${{ matrix.shard }} / 4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: python -m pip install '.[dev]'
      - name: Install pinned Lean version manager
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: certified_lean/.lake
          key: ${{ runner.os }}-mathlib-${{ hashFiles('certified_lean/lean-toolchain', 'certified_lean/lakefile.lean', 'certified_lean/lake-manifest.json') }}
      - name: Prepare exact pinned Mathlib workspace
        working-directory: certified_lean
        run: |
          lake exe cache get
          lake env lean --version
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = d13f23b723b8a846827a245b89c10fc7d3f11612
          git diff --exit-code -- lean-toolchain lakefile.lean lake-manifest.json
      - name: Replay exact sources and allowed axioms
        run: >-
          python scripts/replay_results.py
          --shard-index ${{ matrix.shard }} --shard-count 4
          --timeout 120 --output runs/ci-replay-${{ matrix.shard }}.json
      - name: Retain replay report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-replay-${{ matrix.shard }}
          path: runs/ci-replay-${{ matrix.shard }}.json
          if-no-files-found: warn
